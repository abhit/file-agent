version: '3.8'

services:
  agent-ui:
    build: .
    container_name: file-share-agent
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data 
      - ./chroma_db:/app/chroma_db
    environment:
      # Tell the UI where the Ollama service is located inside the docker network
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # Ensure model weights are saved locally so they don't have to be re-downloaded
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
    # Use DGX Spark GPUs for model acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
